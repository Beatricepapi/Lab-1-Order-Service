services:
  order:
    image: cicd1-order-service:lab7
    ports:
      - "8082:8082"
    environment:
      CATALOG_SERVICE_URL: host.docker.internal:8081
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:h2:file:/app/data/orderdb
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    volumes:
      - order_data:/app/data

volumes:
  order_data:
